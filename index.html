<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Front</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cuadrado">
    <div class="zona arco">
      <div class="linea"></div>
      <div class="jugadores fila-arco">
        <div class="jugador">ARQ</div>
      </div>
    </div>

    <div class="zona defensa">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-defensa">
        <div class="jugador"></div>
        <div class="jugador"></div>
        <div class="jugador"></div>
        <div class="jugador"></div>
      </div>
      <span>DEFENSA</span>
    </div>

    <div class="zona centro">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-centro">
        <div class="jugador"></div>
        <div class="jugador"></div>
        <div class="jugador"></div>
      </div>
      <span>CENTRO</span>
    </div>

    <div class="zona ataque">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-ataque">
        <div class="jugador"></div>
        <div class="jugador"></div>
        <div class="jugador"></div>
      </div>
      <span>ATAQUE</span>
    </div>
  </div>
</body>
</html>
