<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Front</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cuadrado">
    <div class="zona arco">
      <div class="linea"></div>
      <div class="jugadores fila-arco"><div class="jugador"><div class="cuadro"><div class="dorsal">1</div></div><span>Lev Yashin</span></div></div>
    </div>
    <div class="zona defensa">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-defensa">
        <div class="jugador"><div class="cuadro"><div class="dorsal">2</div></div><span>Cafú</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">5</div></div><span>Franz Beckenbauer</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">3</div></div><span>Paolo Maldini</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">6</div></div><span>Roberto Carlos</span></div>
      </div>
    </div>
    <div class="zona centro">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-centro">
        <div class="jugador"><div class="cuadro"><div class="dorsal">8</div></div><span>Lothar Matthäus</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Diego Maradona</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Pelé</span></div>
      </div>
    </div>
    <div class="zona ataque">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-ataque">
        <div class="jugador"><div class="cuadro"><div class="dorsal">7</div></div><span>Cristiano Ronaldo</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">9</div></div><span>Ronaldo Nazario</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Lionel Messi</span></div>
      </div>
    </div>
  </div>
</body>
</html>
