<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Front</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cuadrado">
    <div class="zona arco">
      <div class="linea"></div>
      <div class="jugadores fila-arco"><div class="jugador"><div class="cuadro"><div class="dorsal">1</div></div><span>Lev Yashin</span><span class="posicion">ARQ</span></div></div>
    </div>
    <div class="zona defensa">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-defensa">
        <div class="jugador"><div class="cuadro"><div class="dorsal">2</div></div><span>Cafú</span><span class="posicion">DFD</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">5</div></div><span>Franz Beckenbauer</span><span class="posicion">DFC</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">3</div></div><span>Paolo Maldini</span><span class="posicion">DFC</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">6</div></div><span>Roberto Carlos</span><span class="posicion">DFI</span></div>
      </div>
    </div>
    <div class="zona centro">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-centro">
        <div class="jugador"><div class="cuadro"><div class="dorsal">8</div></div><span>Lothar Matthäus</span><span class="posicion">MC</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Diego Maradona</span><span class="posicion">MCO</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Pelé</span><span class="posicion">MC</span></div>
      </div>
    </div>
    <div class="zona ataque">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-ataque">
        <div class="jugador"><div class="cuadro"><div class="dorsal">7</div></div><span>Cristiano Ronaldo</span><span class="posicion">EI</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">9</div></div><span>Ronaldo Nazario</span><span class="posicion">DC</span></div>
        <div class="jugador"><div class="cuadro"><div class="dorsal">10</div></div><span>Lionel Messi</span><span class="posicion">ED</span></div>
      </div>
    </div>
  </div>

  <script>
    const jugadores = document.querySelectorAll('.jugador');
    const jugadorGol = jugadores[Math.floor(Math.random() * jugadores.length)];
    const pelota = document.createElement('div');
    pelota.className = 'pelota-gol';
    pelota.textContent = '⚽';
    pelota.setAttribute('aria-label', 'Gol');
    jugadorGol.prepend(pelota);
  </script>
</body>
</html>
