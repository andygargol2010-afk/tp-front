<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Front</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cuadrado">
    <div class="zona arco">
      <div class="linea"></div>
      <div class="jugadores fila-arco"><div class="jugador">Lev Yashin</div></div>
    </div>
    <div class="zona defensa">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-defensa"><div class="jugador">Cafú</div><div class="jugador">Franz Beckenbauer</div><div class="jugador">Paolo Maldini</div><div class="jugador">Roberto Carlos</div></div>
      <span>DEFENSA</span>
    </div>
    <div class="zona centro">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-centro"><div class="jugador">Lothar Matthäus</div><div class="jugador">Diego Maradona</div><div class="jugador">Pelé</div></div>
      <span>CENTRO</span>
    </div>
    <div class="zona ataque">
      <div class="lineas"><div class="linea"></div><div class="linea"></div></div>
      <div class="jugadores fila-ataque"><div class="jugador">Cristiano Ronaldo</div><div class="jugador">Ronaldo Nazario</div><div class="jugador">Lionel Messi</div></div>
      <span>ATAQUE</span>
    </div>
  </div>
</body>
</html>
